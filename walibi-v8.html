<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b36c9">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
<title>Walibi Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma só ecrã. Cabeçalho com hora e estado dos dados, conteúdo que desliza, barra de separadores em baixo (polegar). */
:root {
  --bg: #edf0f2; --surface: #ffffff; --surface2: #e3e8ec; --ink: #121b24; --muted: #566573; --line: #cfd7de;
  --accent: #4b36c9; --accent-ink: #ffffff; --accent-soft: #e6e2fb;
  --good: #17803f; --good-soft: #dcf2e3; --warn: #9a5700; --warn-soft: #fbebcf; --bad: #bf2f27; --bad-soft: #fbdedb;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b; --surface: #17202a; --surface2: #202c38; --ink: #e9eef3; --muted: #9aabb9; --line: #2b3946;
    --accent: #a99bff; --accent-ink: #14102e; --accent-soft: #272148;
    --good: #5ad188; --good-soft: #12301f; --warn: #f0b24a; --warn-soft: #3a2a0c; --bad: #ff8a80; --bad-soft: #3d1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #17202a; --surface2: #202c38; --ink: #e9eef3; --muted: #9aabb9; --line: #2b3946;
  --accent: #a99bff; --accent-ink: #14102e; --accent-soft: #272148;
  --good: #5ad188; --good-soft: #12301f; --warn: #f0b24a; --warn-soft: #3a2a0c; --bad: #ff8a80; --bad-soft: #3d1a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* cabeçalho */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 8px; flex: none; }
.clock b { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; letter-spacing: .01em; }
.clock span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; max-width: 100%; }
.top .chip { white-space: nowrap; flex: none; }
.clock { min-width: 0; }
.clock span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip svg { width: 15px; height: 15px; flex: none; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.plain { min-height: 26px; padding: 1px 9px; font-size: 12.5px; font-weight: 600; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* conteúdo */
#view > * { flex: none; }
#view { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-block: 4px 16px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sec-title { font-family: var(--display); font-size: 20px; font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }

/* próxima atração */
.next { display: flex; flex-direction: column; gap: 12px; border-color: var(--accent); border-width: 2px; }
.next h1 { font-family: var(--display); font-size: 34px; line-height: 1.02; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { font-family: var(--display); font-size: 26px; line-height: 1.1; font-weight: 700; }
.stat b i { font-style: normal; font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.stat.good b { color: var(--good); } .stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; padding: 8px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.full { grid-column: 1 / -1; }
.btn.sm { min-height: 40px; font-size: 14px; padding: 6px 12px; }
.btn[disabled] { opacity: .5; cursor: default; }

/* aviso (conselho) */
.advice { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.advice.defer, .advice.switch, .advice.closed { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.advice.wait { background: var(--accent-soft); border: 1px solid var(--accent); }
.advice.go { background: var(--good-soft); border: 1px solid var(--good); }
.advice b.t { font-family: var(--display); font-size: 17px; }

/* listas */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; }
.item:first-child { border-top: 0; }
.item .nm { font-weight: 700; overflow-wrap: anywhere; }
.item .sub { font-size: 13px; color: var(--muted); }
.badge { flex: none; width: 54px; text-align: center; border-radius: 10px; padding: 5px 0 4px; font-family: var(--display); line-height: 1; }
.badge b { display: block; font-size: 24px; font-weight: 700; }
.badge small { font-size: 11px; font-weight: 600; letter-spacing: .04em; }
.badge.good { background: var(--good-soft); color: var(--good); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.none { background: var(--surface2); color: var(--muted); }
.time { flex: none; width: 52px; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; }
.time small { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.tick { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
.tick svg { width: 20px; height: 20px; }
.tick.on { background: var(--good-soft); color: var(--good); border-color: transparent; }
.is-done .nm { text-decoration: line-through; color: var(--muted); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; min-height: 38px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sumrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
details { border-radius: var(--radius); }
details > summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.breakrow { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-weight: 600; }

/* definições */
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding-block: 4px; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; }
.field label, .field .lab { min-width: 0; flex: 1 1 auto; }
.field .hint { display: block; font-size: 12.5px; color: var(--muted); }
input[type="number"], input[type="time"], select, textarea { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; max-width: 100%; }
input[type="number"] { width: 84px; text-align: center; }
input[type="time"] { width: 150px; }
textarea { width: 100%; min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); background: var(--accent-ink); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.person { display: flex; align-items: center; gap: 8px; padding-block: 4px; border-top: 1px solid var(--line); }
.person:first-of-type { border-top: 0; }
.kid { border-top: 1px solid var(--line); padding-block: 8px; display: grid; gap: 8px; }
.kid:first-of-type { border-top: 0; }
.kid .l1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kid .l2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kid label { color: var(--muted); font-size: 14px; }

/* barra de separadores */
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding-block: 6px 4px; border-top: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: 6px; background: var(--bg); }
.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border: 0; background: none; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(8, 12, 18, .55); }
.sheet-panel { position: relative; width: 100%; max-width: 560px; max-height: 88%; display: flex; flex-direction: column; background: var(--surface); border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 12px 6px; }
.sheet-head h2 { font-family: var(--display); font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
.sheet-body { overflow-y: auto; padding-block: 4px 18px; display: flex; flex-direction: column; gap: 12px; }
.x { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface2); font-size: 22px; line-height: 1; flex: none; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

/* mapa */
.mapbox { padding: 8px; }
.mapbox svg { width: 100%; height: auto; display: block; max-height: 52vh; }
.mapbox text { font-family: var(--body); font-size: 10.5px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
.bars rect { transition: none; }
@media (prefers-reduced-motion: reduce) { .pulse, .spin svg { animation: none; } }
@media (max-width: 360px) { .next h1 { font-size: 30px; } .stat b { font-size: 23px; } }

.mapbox.sat text { fill: #fff; stroke: rgba(0,0,0,.8); stroke-width: 3.2px; }
.mapbox.sat circle[r="8"] { stroke: #fff; }
.gpsbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
.gpsbar.good { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
.gpsbar.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
.gpsbar.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }

/* mapa interativo */
.imap { position: relative; height: 46vh; min-height: 280px; max-height: 430px; border-radius: 14px; overflow: hidden; background: var(--surface2); border: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; flex: none; }
.imap.big { height: 62vh; max-height: none; min-height: 320px; }
.imap-tiles { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
.imap-tile { position: absolute; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.imap-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
.imap-svg text { font-family: var(--body); font-size: 11.5px; font-weight: 700; fill: #fff; stroke: rgba(0,0,0,.85); stroke-width: 3.2px; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
.imap.plain .imap-svg text { fill: var(--ink); stroke: var(--surface); }
.imap-ctl { z-index: 2; position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
.imap-ctl button { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; font-size: 22px; font-weight: 700; padding: 0; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.imap-ctl button svg { width: 20px; height: 20px; }
.imap-attr { z-index: 2; position: absolute; left: 8px; bottom: 4px; font-size: 10px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
.imap.plain .imap-attr { color: var(--muted); text-shadow: none; }

</style>
</head>
<body>
<header class="top">
  <div class="clock"><b id="clock" class="num">--:--</b><span id="parkstate"></span></div>
  <button id="datachip" class="chip" type="button" aria-label="Estado das filas e dados"></button>
</header>
<main id="view" aria-live="polite"></main>
<nav class="tabs" aria-label="Secções">
  <button type="button" data-action="tab" data-tab="now" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 17-7-4-7 4z"/></svg>Agora</button>
  <button type="button" data-action="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>Plano</button>
  <button type="button" data-action="tab" data-tab="rides" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18c3-9 5-12 7-12s2 6 4 6 4-3 7-3"/><path d="M3 21h18"/></svg>Atrações</button>
  <button type="button" data-action="tab" data-tab="map" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
  <button type="button" data-action="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-action="closeSheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" type="button" data-action="closeSheet" aria-label="Fechar">&times;</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* Walibi Day - motor de lógica (sem DOM). Funciona no browser (window.WCore) e em Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.WCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var PARK = {
    name: 'Walibi Belgium',
    entrance: { lat: 50.7031, lon: 4.5924 },
    open: 600,   // 10:00
    close: 1320, // 22:00 (nocturne)
    qtUrl: 'https://queue-times.com/parks/14/queue_times.json'
  };

  /* Alturas: tabela oficial walibi.be (cm). alone = sozinho, acc = acompanhado por adulto, max = máximo.
     base/peak: médias de espera (min) do queue-times em dias de Halloween/nocturnes.
     lat/lon: posições APROXIMADAS (approx:true) exceto as âncoras da Wikipedia. */
  var RIDES = [
    { id: 'kondaa', name: 'Kondaa', zone: 'Exotic World', lat: 50.69771, lon: 4.58499, anchor: true, dur: 4, value: 10, must: true, thrill: 3, wet: false, h: { alone: 130, acc: null, max: 195 }, base: 38, peak: 88, keys: ['kondaa'] },
    { id: 'mecalodon', name: 'Mecalodon', zone: 'Dock World', lat: 50.7034, lon: 4.5931, anchor: true, dur: 4, value: 9, must: true, thrill: 2, wet: false, h: { alone: 120, acc: 100, max: null }, base: 28, peak: 60, keys: ['mecalodon', 'megalodon'] },
    { id: 'pulsar', name: 'Pulsar', zone: 'Dock World', lat: 50.6988, lon: 4.5903, anchor: true, dur: 3, value: 9, must: true, thrill: 3, wet: true, h: { alone: 120, acc: null, max: null }, base: 26, peak: 57, keys: ['pulsar'] },
    { id: 'tiki', name: 'Tiki-Waka', zone: 'Exotic World', lat: 50.6979, lon: 4.5856, dur: 4, value: 8, must: true, thrill: 2, wet: false, h: { alone: 120, acc: 100, max: null }, base: 40, peak: 80, keys: ['tikiwaka', 'tiki'] },
    { id: 'tutankhamon', name: 'Challenge of Tutankhamon', short: 'Tutankhamon', zone: 'Exotic World', lat: 50.6974, lon: 4.5846, dur: 8, value: 7, must: true, thrill: 1, wet: false, h: { alone: 120, acc: 80, max: null }, base: 26, peak: 51, keys: ['challengeoftutankhamon', 'tutankhamon', 'tutankamon', 'tutankhamun'] },

      '<p class="small muted" style="margin-top:12px">Filas: Powered by <a href="https://queue-times.com/" target="_blank" rel="noopener" style="color:var(--accent)">Queue-Times.com</a>. Alturas: tabela oficial em <a href="https://www.walibi.be/en/explore-the-park/attractions" target="_blank" rel="noopener" style="color:var(--accent)">walibi.be</a>. Esperas típicas: médias do queue-times em dias de Halloween e nocturnes. Posições no mapa: estimativas. Esta app não é oficial.</p></section>';
    return html;
  }
  function fieldTime(k, lab, hint, v) {
    var from = k === 'end' ? 840 : 660, to = k === 'end' ? 1320 : 930, opts = [], seen = false;
    for (var m = from; m <= to; m += 15) { var t = C.fmtTime(m); if (t === v) seen = true; opts.push(t); }
    if (!seen) opts.push(v);
    return '<div class="field"><label for="f_' + k + '" class="lab">' + lab + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label><select id="f_' + k + '" data-set="' + k + '">' +
      opts.map(function (t) { return '<option value="' + t + '"' + (t === v ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>';
  }
  function fieldNum(k, lab, hint, v, mn, mx) { return '<div class="field"><label for="f_' + k + '" class="lab">' + lab + '</label><input id="f_' + k + '" type="number" inputmode="numeric" min="' + mn + '" max="' + mx + '" value="' + esc(v) + '" data-set="' + k + '"></div>'; }
  function fieldSwitch(k, lab, hint, v) { return '<div class="field"><label for="f_' + k + '" class="lab">' + lab + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label><span class="switch"><input id="f_' + k + '" type="checkbox" role="switch" data-set="' + k + '"' + (v ? ' checked' : '') + '><span></span></span></div>'; }

  /* ---------- folhas ---------- */
  function openSheet(title, bodyHtml, kind) {
    rt.sheet = kind || 'x';
    $('sheetTitle').textContent = title; $('sheetBody').innerHTML = bodyHtml; $('sheet').hidden = false;
    var b = $('sheet').querySelector('.x'); if (b) b.focus();
  }
  function closeSheet() { rt.sheet = null; $('sheet').hidden = true; }
  function sheetRide(id) {
    var ctx = baseCtx(), env = ctx.env, r = allRide(id), e = C.eligibility(r, ctx.party, ctx.opts);
    var L = env.live[id], walk = C.walkMin(ctx.pos, r, ctx.opts.speed), wait = C.predictWait(r, ctx.t + walk, env);
    var H = r.h, hs = 'Mín. ' + H.alone + ' cm sozinho' + (H.acc ? ' · ' + H.acc + ' cm com adulto' : '') + (H.max ? ' · máx. ' + H.max + ' cm' : '');
    var isDone = !!S.done[id], man = S.manual[id];
    var bars = '', mx = 1, vals = [];
    for (var h = 10; h <= 21; h++) { var v = Math.round(C.histWait(r, h * 60 + 30) * env.dayFactor); vals.push(v); mx = Math.max(mx, v); }
    if (L && L.open !== false) mx = Math.max(mx, L.wait);
    var nowH = Math.floor(nowMin() / 60);
    vals.forEach(function (v, i) {
      var h = 10 + i, bh = Math.max(2, Math.round(v / mx * 56)), cur = h === nowH;
      bars += '<rect x="' + (i * 26 + 4) + '" y="' + (66 - bh) + '" width="18" height="' + bh + '" rx="3" fill="' + (cur ? 'var(--accent)' : 'var(--line)') + '"/>' +
        '<text x="' + (i * 26 + 13) + '" y="' + (62 - bh) + '" text-anchor="middle" style="font-size:9px;fill:var(--muted);stroke:none">' + v + '</text>' +
        (h % 2 === 0 ? '<text x="' + (i * 26 + 13) + '" y="80" text-anchor="middle" style="font-size:10px;fill:var(--muted);stroke:none">' + h + 'h</text>' : '');
    });
    var body = '<div class="row wrap">' + eligChip(e) + '<span class="small muted grow">' + esc(e.detail || hs) + '</span></div>' +
      '<div class="stats"><div class="stat"><small>A pé</small><b class="num">' + walk + '<i>min</i></b></div><div class="stat ' + waitClass(wait) + '"><small>' + (L ? 'Fila agora' : 'Fila prevista') + '</small><b class="num">' + (L && L.open === false ? '–' : (L ? L.wait : wait)) + '<i>min</i></b></div><div class="stat"><small>Duração</small><b class="num">' + r.dur + '<i>min</i></b></div></div>' +
      (L && L.open === false ? '<div class="advice closed"><b class="t">Fechada neste momento</b></div>' : '') +
      '<div><div class="eyebrow">Fila típica por hora</div><svg viewBox="0 0 316 86" width="100%" role="img" aria-label="Fila típica por hora do dia" class="bars">' + bars + '</svg><p class="small muted">Médias do queue-times, ajustadas ao que se vê hoje. A hora atual está destacada.</p></div>' +
      '<p class="small muted">' + esc(r.zone) + (r.wet ? ' · molha' : '') + (e.detail ? '. ' + esc(hs) + '.' : '') + '</p>';
    var g = rt.gpsPos && Date.now() - rt.gpsPos.ts < 120000 && C.meters(rt.gpsPos, C.PARK.entrance) < 1500;
    body += '<div class="btns"><button class="btn primary" data-action="' + (isDone ? 'undo' : 'done') + '" data-id="' + id + '">' + ICON.check + ' ' + (isDone ? 'Desfazer feita' : 'Já fiz') + '</button>' +
      '<button class="btn" data-action="gotoClose" data-id="' + id + '">' + ICON.pin + ' ' + (S.target === id ? 'Soltar' : 'Ir para aqui') + '</button>' +
      '<button class="btn" data-action="' + (S.skip[id] ? 'unskip' : 'skip') + '" data-id="' + id + '">' + (S.skip[id] ? 'Voltar a incluir' : 'Saltar hoje') + '</button>' +
      '<button class="btn" data-action="calib" data-id="' + id + '"' + (g ? '' : ' disabled') + '>Estou aqui</button></div>' +
      (g ? '' : '<p class="small muted">"Estou aqui" corrige a posição desta atração e precisa de GPS ativo junto a ela.</p>');
    body += '<div class="field" style="border:0"><span class="lab">Fila lida no painel<span class="hint">' + (man ? 'Valor manual: ' + man.wait + ' min' : 'Usa se o ecrã da atração mostrar outro valor') + '</span></span><span class="row"><button class="btn sm" data-action="mw" data-id="' + id + '" data-d="-5" aria-label="menos 5 minutos">−5</button><button class="btn sm" data-action="mw" data-id="' + id + '" data-d="5" aria-label="mais 5 minutos">+5</button>' + (man ? '<button class="btn sm" data-action="mwClear" data-id="' + id + '">Limpar</button>' : '') + '</span></div>';
    openSheet(r.name, body, 'ride:' + id);
  }
  function sheetData() {
    var ds = dataStatus();
    openSheet('Dados das filas',
      '<p><b>' + esc(ds.txt) + '.</b> A app tenta ligar-se ao queue-times sozinha. Se este ecrã bloquear o acesso, usa o caminho manual.</p>' +
      '<div class="btns"><button class="btn primary full" data-action="refresh">' + ICON.refresh + ' Tentar de novo</button></div>' +
      '<div class="card" style="background:var(--surface2);border:0"><b>Colar dados (funciona sempre)</b><ol class="small" style="padding-left:18px;margin:8px 0">' +
      '<li>Toca em <a href="https://queue-times.com/parks/14/queue_times.json" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">Abrir filas</a> (abre noutro separador).</li><li>Seleciona todo o texto, copia e volta aqui.</li><li>Cola na caixa e toca em Usar.</li></ol>' +
      '<label for="pasteBox" class="small muted">Texto copiado</label><textarea id="pasteBox" placeholder="{&quot;lands&quot;:[…"></textarea><div id="pasteMsg" class="small" role="status" style="min-height:20px"></div>' +
      '<div class="btns"><button class="btn primary full" data-action="pasteApply">Usar estes dados</button></div></div>' +
      '<p class="small muted">Também podes escrever a fila de cada atração: abre-a na lista e usa −5 / +5 com o valor do painel à entrada.</p>', 'data');
  }
  function sheetPos() {
    var list = C.RIDES.filter(function (r) { return !r.retired; });
    openSheet('Onde estás?',
      '<p class="small muted">' + esc(gpsText()) + '</p><div class="btns"><button class="btn primary full" data-action="startGps">' + ICON.pin + ' Usar o GPS</button><button class="btn full" data-action="posEntrance">Estou na entrada</button></div>' +
      '<div class="eyebrow">Ou escolhe a atração mais perto</div><div class="list">' + list.map(function (r) {
        return '<button class="item" data-action="posRide" data-id="' + r.id + '"><div class="grow"><div class="nm">' + esc(r.name) + '</div><div class="sub">' + esc(r.zone) + '</div></div></button>';
      }).join('') + '</div>', 'pos');
  }
  function sheetImport() {
    var cur = S.imp.ids.map(function (id) { return C.RIDE_BY_ID[id].name; }).join('\n');
    openSheet('Minha lista de atrações',
      '<p class="small muted">Escreve ou cola uma atração por linha (ou separadas por vírgulas). Reconheço nomes como "tiki waka" ou "mecalodon".</p>' +
      '<label for="impBox" class="small muted">Lista</label><textarea id="impBox" placeholder="Kondaa&#10;Mecalodon&#10;Tiki-Waka">' + esc(cur) + '</textarea><div id="impMsg" class="small" role="status" style="min-height:20px"></div>' +
      '<div class="field"><label for="impKeep" class="lab">Seguir a minha ordem<span class="hint">Desligado: otimizo a ordem para menos espera</span></label><span class="switch"><input id="impKeep" type="checkbox" role="switch"' + (S.imp.keep ? ' checked' : '') + '><span></span></span></div>' +
      '<div class="field"><label for="impOnly" class="lab">Só estas<span class="hint">Desligado: junto outras para aproveitar o tempo</span></label><span class="switch"><input id="impOnly" type="checkbox" role="switch"' + (S.imp.only ? ' checked' : '') + '><span></span></span></div>' +
      '<div class="btns"><button class="btn primary" data-action="impApply">Usar lista</button><button class="btn" data-action="clearImport">Limpar</button></div>', 'imp');
  }

  /* ---------- render ---------- */
  function renderHeader() {
    var now = nowMin();
    $('clock').textContent = C.fmtTime(now);
    var st = now < C.PARK.open ? 'Abre às 10:00' : (now >= C.PARK.close ? 'Parque fechado' : 'Aberto até 22:00');
    $('parkstate').textContent = st;
    var ds = dataStatus(), el = $('datachip');
    el.className = 'chip ' + ds.cls + (ds.spin ? ' spin' : '');
    el.innerHTML = ICON.refresh + '<span>' + esc(ds.txt) + '</span>';
  }
  function render() {
    if (MAP.touching) { rt.renderLater = true; return; }
    renderHeader();
    var tab = S.ui.tab, v = $('view'), html = '';
    var top = v.scrollTop;
    try {
      html = tab === 'plan' ? viewPlan() : tab === 'rides' ? viewRides() : tab === 'map' ? viewMap() : tab === 'set' ? viewSettings() : viewNow();
    } catch (err) {
      html = '<div class="card"><b>Algo falhou ao desenhar este ecrã.</b><p class="small muted">' + esc(err && err.message) + '</p><div class="btns"><button class="btn" data-action="resetDay">Recomeçar o dia</button></div></div>';
      if (window.console) console.error(err);
    }
    v.innerHTML = html; v.scrollTop = top; mountMap();
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]'); if (!el) return;
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    if (/^(done|skip|target|goto|gotoClose|recalc|replan|undo)$/.test(a)) rt.mv.auto = true;
    switch (a) {
      case 'tab': S.ui.tab = el.getAttribute('data-tab'); save(); render(); $('view').scrollTop = 0; break;
      case 'done': markDone(id); if (rt.sheet) closeSheet(); break;
      case 'undo': undoDone(id); if (rt.sheet) closeSheet(); break;
      case 'skip': S.skip[id] = true; if (S.target === id) S.target = null; invalidate(); save(); if (rt.sheet) closeSheet(); render(); toast('Retirada do plano de hoje'); break;
      case 'unskip': delete S.skip[id]; invalidate(); save(); closeSheet(); render(); break;
      case 'target': setTarget(id); break;
      case 'gotoClose': setTarget(id); closeSheet(); break;
      case 'goto': S.target = id; invalidate(); save(); render(); toast('A caminho: ' + C.RIDE_BY_ID[id].short); break;
      case 'ride': sheetRide(id); break;
      case 'closeSheet': closeSheet(); break;
      case 'replan': invalidate(); S.target = null; save(); render(); toast('Plano recalculado'); break;
      case 'refresh': refreshLive(true); break;
      case 'dataSheet': case 'datachip': sheetData(); break;
      case 'posSheet': sheetPos(); break;
      case 'posEntrance': S.pos = null; invalidate(); save(); closeSheet(); render(); toast('Partida na entrada'); break;
      case 'posRide': setPosRide(id); S.pos.src = 'manual'; invalidate(); save(); closeSheet(); render(); toast('Estás perto de ' + C.RIDE_BY_ID[id].short); break;
      case 'satToggle': S.ui.sat = S.ui.sat === false; save(); render(); break;
      case 'mapZoom': rt.mv.auto = false; mapZoomAt(MAP.w / 2, MAP.h / 2, rt.mv.z + Number(el.getAttribute('data-d'))); break;
      case 'mapLocate': rt.mv.auto = true; mapUpdate(); if (!mapGpsFresh()) toast('Sem GPS: centrei na posição escolhida'); break;
      case 'mapPark': rt.mv.auto = false; mapFitPark(); mapPaint(); break;
      case 'toFile': try { location.href = 'file:///storage/emulated/0/Download/'; } catch (e) {} setTimeout(function () { toast('O Chrome bloqueou. Usa "Copiar endereço" e cola na barra do Chrome.'); }, 1500); break;
      case 'copyFile': (function () { var t = 'file:///storage/emulated/0/Download/'; var ok = function () { toast('Copiado! Cola na barra do Chrome e toca no walibi-day mais recente.'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { prompt('Copia este endereço:', t); });
        else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); } })(); break;
      case 'recalc': rt.fails = 0; invalidate(); render(); refreshLive(true); toast('Rota recalculada'); break;
      case 'startGps': startGPS(); toast('A pedir localização…'); setTimeout(function () { if (rt.sheet === 'pos') sheetPos(); render(); }, 1200); break;
      case 'filter': S.ui.filter = el.getAttribute('data-v'); save(); render(); break;
      case 'sort': S.ui.sort = el.getAttribute('data-v'); save(); render(); break;
      case 'breakDone': S.breakTaken = true; invalidate(); save(); render(); break;
      case 'skipBreak': S.breakTaken = true; invalidate(); save(); render(); toast('Sem pausa hoje'); break;
      case 'importSheet': sheetImport(); break;
      case 'clearImport': S.imp = { ids: [], keep: false, only: true }; invalidate(); save(); closeSheet(); render(); break;
      case 'impApply': {
        var res = C.parseList($('impBox').value);
        if (!res.ids.length) { $('impMsg').textContent = 'Não reconheci nenhuma atração. Escreve nomes como Kondaa ou Tiki-Waka, um por linha.'; break; }
        S.imp = { ids: res.ids, keep: $('impKeep').checked, only: $('impOnly').checked }; invalidate(); save(); closeSheet(); S.ui.tab = 'plan'; render();
        toast(res.ids.length + ' atrações na lista' + (res.unknown.length ? ' · ' + res.unknown.length + ' não reconhecidas: ' + res.unknown.slice(0, 2).join(', ') : ''));
        break;
      }
      case 'pasteApply': {
        var p = C.parseQueueTimes($('pasteBox').value);
        if (!p) { $('pasteMsg').textContent = 'Não reconheci estes dados. Abre a ligação, seleciona tudo, copia e cola de novo.'; $('pasteMsg').style.color = 'var(--bad)'; break; }
        applyLive(p, 'paste'); closeSheet(); render(); toast('Filas atualizadas (' + p.matched + ' atrações)');
        break;
      }
      case 'mw': {
        var cur = (S.manual[id] && S.manual[id].wait != null) ? S.manual[id].wait : (function () { var L = getEnv().live[id]; return L ? L.wait : Math.round(C.histWait(C.RIDE_BY_ID[id], nowMin())); })();
        S.manual[id] = { wait: Math.max(0, cur + Number(el.getAttribute('data-d'))), ts: Date.now() }; invalidate(); save(); render(); sheetRide(id); break;
      }
      case 'mwClear': delete S.manual[id]; invalidate(); save(); render(); sheetRide(id); break;
      case 'calib': if (rt.gpsPos) { S.calib[id] = { lat: rt.gpsPos.lat, lon: rt.gpsPos.lon }; invalidate(); save(); closeSheet(); render(); toast('Posição de ' + C.RIDE_BY_ID[id].short + ' corrigida'); } break;
      case 'addAdult': S.set.adults.push(170); invalidate(); save(); render(); break;
      case 'rmAdult': S.set.adults.splice(+el.getAttribute('data-i'), 1); invalidate(); save(); render(); break;
      case 'addKid': S.set.kids.push({ age: 8, h: 122 }); invalidate(); save(); render(); break;
      case 'rmKid': S.set.kids.splice(+el.getAttribute('data-i'), 1); invalidate(); save(); render(); break;
      case 'resetDay': Object.assign(S, freshDay()); S.day = todayKey(); invalidate(); save(); render(); toast('Dia recomeçado'); break;
      case 'resetCalib': S.calib = {}; invalidate(); save(); render(); toast('Posições repostas'); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target; var k = el.getAttribute && el.getAttribute('data-set'); if (!k) return;
    var i = +el.getAttribute('data-i'), v = el.type === 'checkbox' ? el.checked : el.value;
    var num = function (x, lo, hi, d) { x = parseInt(x, 10); return isNaN(x) ? d : Math.min(hi, Math.max(lo, x)); };
    if (k === 'adult') S.set.adults[i] = num(v, 120, 230, 172);
    else if (k === 'kidAge') S.set.kids[i].age = num(v, 1, 17, 8);
    else if (k === 'kidH') S.set.kids[i].h = num(v, 60, 200, 122);
    else if (k === 'breakLen') S.set.breakLen = num(v, 10, 120, 40);
    else if (k === 'speed') S.set.speed = Number(v);
    else if (k === 'end' || k === 'breakStart') { if (/^\d{1,2}:\d{2}$/.test(v)) S.set[k] = v; }
    else S.set[k] = v;
    invalidate(); save(); render();
  });
  $('datachip').addEventListener('click', function () { sheetData(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && rt.sheet) closeSheet(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { if (rt.gps !== 'denied') restartGPS(); render(); if (rt.fails < 3 && (!S.live || Date.now() - S.live.fetchedAt > 180000)) refreshLive(false); }
  });

  /* ---------- arranque ---------- */
  function tick() {
    var m = nowMin();
    if (!rt.sheet) { var gb = document.querySelector('.gpsbar'); if (gb) gb.outerHTML = mapGps(); else { var gp = $('gpsline'); if (gp) gp.textContent = gpsText(); } }
    if (!rt.sheet && MAP.root && MAP.root.isConnected) mapUpdate();
    if (m !== rt.tickMin) { rt.tickMin = m; if (!rt.sheet) { invalidate(); render(); } else renderHeader(); }
  }
  window.__walibi = { S: S, rt: rt, C: C, render: render, getPlan: getPlan, refreshLive: refreshLive, applyLive: applyLive, startGPS: startGPS };
  render();
  startGPS();
  refreshLive(false);
  setInterval(tick, 5000);
  setInterval(function () { if (document.visibilityState === 'visible' && rt.fails < 3) refreshLive(false); }, 180000);
})();

</script>
</body>
</html>
