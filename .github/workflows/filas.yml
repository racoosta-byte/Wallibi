name: filas
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sf https://queue-times.com/parks/14/queue_times.json -o queue.json
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add queue.json
          git commit -m filas || exit 0
          git push
